/* Ichki MP4 yozuvchi (H.264 + AAC/Opus). Tashqi kutubxona va internet kerak emas.
   Struktura: ftyp | moov | mdat (faststart). Kadrlar tartibi = ko'rsatish tartibi (B-kadrsiz). */
const Mp4Muxer=(()=>{
const TE=new TextEncoder();
const cat=l=>{let n=0;for(const x of l)n+=x.length;const o=new Uint8Array(n);let p=0;for(const x of l){o.set(x,p);p+=x.length}return o};
const u8=(...a)=>Uint8Array.from(a);
const u32=n=>u8((n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255),u16=n=>u8((n>>8)&255,n&255);
const str=s=>TE.encode(s),Z=n=>new Uint8Array(n);
const box=(t,...c)=>{const b=cat(c);return cat([u32(b.length+8),str(t),b])};
const fb=(t,v,f,...c)=>box(t,u8(v,(f>>16)&255,(f>>8)&255,f&255),...c);
const tbl=a=>{const o=new Uint8Array(a.length*4),d=new DataView(o.buffer);a.forEach((x,i)=>d.setUint32(i*4,x>>>0));return o};
const toU8=d=>d instanceof ArrayBuffer?new Uint8Array(d.slice(0)):new Uint8Array(d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength));
const MAT=cat([u32(0x10000),u32(0),u32(0),u32(0),u32(0x10000),u32(0),u32(0),u32(0),u32(0x40000000)]);
const rle=a=>{const o=[];for(const x of a){if(o.length&&o[o.length-1][1]==x)o[o.length-1][0]++;else o.push([1,x])}return o};
class ArrayBufferTarget{}
class Muxer{
 constructor(o){this.o=o;this.V=[];this.A=[];this.vd=null;this.ad=null;this.target=o.target||new ArrayBufferTarget();this.out=null}
 addVideoChunk(c,m){const b=new Uint8Array(c.byteLength);c.copyTo(b);if(!this.vd&&m&&m.decoderConfig&&m.decoderConfig.description)this.vd=toU8(m.decoderConfig.description);this.V.push({b,ts:c.timestamp,key:c.type=='key',du:c.duration||0})}
 addAudioChunk(c,m){const b=new Uint8Array(c.byteLength);c.copyTo(b);if(!this.ad&&m&&m.decoderConfig&&m.decoderConfig.description)this.ad=toU8(m.decoderConfig.description);this.A.push({b,ts:c.timestamp,key:true,du:c.duration||0})}
 timing(S,scale){const st=S.map(s=>Math.round(s.ts*scale/1e6)),du=[];for(let i=0;i<S.length;i++){let d=i+1<S.length?st[i+1]-st[i]:(S[i].du?Math.round(S[i].du*scale/1e6):(du.length?du[du.length-1]:1));du.push(Math.max(1,d))}return du}
 finalize(){
  const o=this.o,V=this.V,A=this.A,W=o.video.width,H=o.video.height;
  if(!V.length)throw new Error("MP4: video kadrlar yo'q");
  if(!this.vd)throw new Error("MP4: avcC (H.264 sarlavhasi) yo'q");
  if(!V[0].key)throw new Error("MP4: birinchi kadr kalit kadr emas");
  const VS=90000,AS=o.audio?o.audio.sampleRate:48000,hasA=!!(o.audio&&A.length);
  const vdu=this.timing(V,VS),adu=hasA?this.timing(A,AS):[];
  // chunk reja: har 1 soniyada video va audio navbatma-navbat
  const plan=[];let vi=0,ai=0;
  for(let s=1;vi<V.length||ai<A.length;s++){const lim=s*1e6;let n=0,f=vi;while(vi<V.length&&V[vi].ts<lim){vi++;n++}if(n)plan.push({t:0,f,n});n=0;f=ai;while(ai<A.length&&A[ai].ts<lim){ai++;n++}if(n)plan.push({t:1,f,n})}

  let total=0;for(const p of plan){p.len=sz(p.t?A:V,p.f,p.n);total+=p.len}
  if(total>4e9)throw new Error("MP4: fayl juda katta (4 GB dan oshdi)");
  const ftyp=box('ftyp',str('isom'),u32(512),str('isom'),str('iso2'),str('avc1'),str('mp41'));
  const vDurMs=Math.round(vdu.reduce((a,b)=>a+b,0)*1000/VS),aDurMs=hasA?Math.round(adu.reduce((a,b)=>a+b,0)*1000/AS):0,durMs=Math.max(vDurMs,aDurMs);
  const build=base=>{
   const offs=[[],[]];let pos=base;for(const p of plan){offs[p.t].push(pos);pos+=p.len}
   const cnt=t=>plan.filter(p=>p.t==t).map(p=>p.n);
   const trak=(id,vid,S,du,scale,entry,offsets,counts,durTk)=>{
    const stts=fb('stts',0,0,u32(rle(du).length),...rle(du).map(([c,d])=>cat([u32(c),u32(d)])));
    const keys=[];if(vid)S.forEach((s,i)=>{if(s.key)keys.push(i+1)});
    const stss=vid?fb('stss',0,0,u32(keys.length),tbl(keys)):null;
    const cr=rle(counts),stscE=[];let fc=1;for(const [c,n] of cr.map(([c,n])=>[c,n])){stscE.push(cat([u32(fc),u32(n),u32(1)]));fc+=c}
    // stsc: rle qiymatlari (soni,namuna_soni) -> (birinchi_chunk, namuna_soni)
    const stsc=fb('stsc',0,0,u32(stscE.length),...stscE);
    const stsz=fb('stsz',0,0,u32(0),u32(S.length),tbl(S.map(s=>s.b.length)));
    const stco=fb('stco',0,0,u32(offsets.length),tbl(offsets));
    const stbl=box('stbl',fb('stsd',0,0,u32(1),entry),stts,...(stss?[stss]:[]),stsc,stsz,stco);
    const minf=box('minf',vid?fb('vmhd',0,1,u16(0),u16(0),u16(0),u16(0)):fb('smhd',0,0,u16(0),u16(0)),box('dinf',fb('dref',0,0,u32(1),fb('url ',0,1))),stbl);
    const mdia=box('mdia',fb('mdhd',0,0,u32(0),u32(0),u32(scale),u32(durTk),u16(0x55c4),u16(0)),fb('hdlr',0,0,u32(0),str(vid?'vide':'soun'),u32(0),u32(0),u32(0),str(vid?'VideoHandler\0':'SoundHandler\0')),minf);
    const tkhd=fb('tkhd',0,3,u32(0),u32(0),u32(id),u32(0),u32(Math.round(durTk*1000/scale)),u32(0),u32(0),u16(0),u16(0),u16(vid?0:0x100),u16(0),MAT,u32(vid?W<<16:0),u32(vid?H<<16:0));
    return box('trak',tkhd,mdia)};
   const avc1=box('avc1',Z(6),u16(1),u16(0),u16(0),u32(0),u32(0),u32(0),u16(W),u16(H),u32(0x480000),u32(0x480000),u32(0),u16(1),Z(32),u16(0x18),u16(0xffff),box('avcC',this.vd));
   const traks=[trak(1,true,V,vdu,VS,avc1,offs[0],cnt(0),vdu.reduce((a,b)=>a+b,0))];
   if(hasA){const ch=o.audio.numberOfChannels||1;let ent;
    if(o.audio.codec=='opus'){let pre=312,rate=48000,gain=0;const d=this.ad;if(d&&d.length>=19&&String.fromCharCode(...d.slice(0,8))=='OpusHead'){pre=d[10]|(d[11]<<8);rate=(d[12]|(d[13]<<8)|(d[14]<<16)|(d[15]<<24))>>>0;gain=d[16]|(d[17]<<8)}
     ent=box('Opus',Z(6),u16(1),u32(0),u32(0),u16(ch),u16(16),u16(0),u16(0),u32((48000<<16)>>>0),box('dOps',u8(0),u8(ch),u16(pre),u32(rate),u16(gain),u8(0)))}
    else{const FI=[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350],fi=FI.indexOf(AS),asc=this.ad&&this.ad.length>=2?this.ad:u8((2<<3)|(fi>>1),((fi&1)<<7)|(ch<<3));
     const dsi=cat([u8(5,asc.length),asc]),dc=cat([u8(4,13+dsi.length,0x40,0x15,0,0,0),u32(0),u32(128000),dsi]),sl=u8(6,1,2),es=cat([u8(3,3+dc.length+sl.length,0,0,0),dc,sl]);
     ent=box('mp4a',Z(6),u16(1),u32(0),u32(0),u16(ch),u16(16),u16(0),u16(0),u32((AS<<16)>>>0),fb('esds',0,0,es))}
    traks.push(trak(2,false,A,adu,AS,ent,offs[1],cnt(1),adu.reduce((a,b)=>a+b,0)))}
   const mvhd=fb('mvhd',0,0,u32(0),u32(0),u32(1000),u32(durMs),u32(0x10000),u16(0x100),u16(0),u32(0),u32(0),MAT,Z(24),u32(hasA?3:2));
   return box('moov',mvhd,...traks)};
  const m0=build(0),base=ftyp.length+m0.length+8,moov=build(base);
  if(moov.length!=m0.length)throw new Error("MP4: ichki xato (moov hajmi)");
  const parts=[ftyp,moov,cat([u32(total+8),str('mdat')])];
  for(const p of plan)for(let i=p.f;i<p.f+p.n;i++)parts.push((p.t?A:V)[i].b);
  this.out=new Blob(parts,{type:'video/mp4'});this.V=[];this.A=[];return this.out}
 blob(){return this.out}
}
return{Muxer,ArrayBufferTarget}})();
window.Mp4Muxer=Mp4Muxer;
</script>

const DSK=new Set(),DSPY="\"\"\"AI Quiz Studio dataset -> LJSpeech format (22.05 kHz) for TTS fine-tuning.\nUsage (Colab):  !unzip -q dataset.zip -d ds  &&  !python ds/prepare_dataset.py ds [speaker]\n\"\"\"\nimport csv, sys, wave, pathlib, collections\nimport numpy as np\n\nsrc = pathlib.Path(sys.argv[1] if len(sys.argv) > 1 else \".\")\nout = pathlib.Path(\"ljspeech\"); (out / \"wavs\").mkdir(parents=True, exist_ok=True)\nRATE, MIN_S, MAX_S = 22050, 0.5, 15.0\n\nwith open(src / \"metadata.csv\", encoding=\"utf-8\", newline=\"\") as f:\n    rows = list(csv.reader(f, delimiter=\"|\", quoting=csv.QUOTE_NONE))[1:]\ncnt = collections.Counter(r[1] for r in rows if len(r) >= 3)\nprint(\"Speakers (ovozlar):\")\nfor s, n in cnt.most_common():\n    print(f\"  {s}: {n} ta ibora\")\nspk = sys.argv[2] if len(sys.argv) > 2 else cnt.most_common(1)[0][0]\nprint(\"Tanlangan ovoz:\", spk)\n\nmeta, total, kept = [], 0.0, 0\nfor wav, s, text in (r for r in rows if len(r) >= 3 and r[1] == spk):\n    with wave.open(str(src / wav), \"rb\") as w:\n        sr, n, raw = w.getframerate(), w.getnframes(), w.readframes(w.getnframes())\n    x = np.frombuffer(raw, dtype=\"<i2\").astype(np.float32) / 32768\n    dur = len(x) / sr\n    if dur < MIN_S or dur > MAX_S or len(text.strip()) < 3:\n        continue\n    t = np.linspace(0, len(x) - 1, int(len(x) * RATE / sr))\n    y = np.interp(t, np.arange(len(x)), x)\n    kept += 1\n    name = f\"{kept:05d}\"\n    with wave.open(str(out / \"wavs\" / f\"{name}.wav\"), \"wb\") as o:\n        o.setnchannels(1); o.setsampwidth(2); o.setframerate(RATE)\n        o.writeframes((np.clip(y, -1, 1) * 32767).astype(\"<i2\").tobytes())\n    meta.append(f\"{name}|{text}|{text}\")\n    total += dur\n\n(out / \"metadata.csv\").write_text(\"\\n\".join(meta) + \"\\n\", encoding=\"utf-8\")\nprint(f\"\\nTayyor: {kept} ta fayl, {total/60:.1f} daqiqa ({total/3600:.2f} soat) -> {out}/\")\nif total < 3600:\n    print(\"OGOHLANTIRISH: 1 soatdan kam. Sifat past bo'lishi mumkin; ko'proq yig'ing.\")\n",DSRD="AI QUIZ STUDIO - DATASET\n========================\nmetadata.csv : wav|speaker|text   (har bir qator = bitta audio ibora)\nwavs/        : 24 kHz, 16-bit, mono WAV\n\n1) Datasetni tozalash va LJSpeech formatiga o'tkazish (Google Colab yoki o'z kompyuteringiz, Python + numpy):\n     python prepare_dataset.py . [ovoz_nomi]\n   Natija: ljspeech/ papkasi (22.05 kHz, id|text|text).\n\n2) O'qitish (fine-tuning): ochiq TTS modelini (masalan Piper yoki Coqui XTTS-v2) shu ljspeech/\n   dataset bilan to'g'rilang. Aniq buyruqlar versiyaga qarab o'zgaradi - model repozitoriysidagi\n   joriy qo'llanmadan foydalaning. Bu skript o'qitishni bajarmaydi.\n\nEslatma:\n - Yaxshi sifat uchun odatda bir necha soat toza audio kerak.\n - Dataset boshqa xizmatlar (Gemini, Deepgram va h.k.) ovozlaridan yig'ilgan. Ularning foydalanish shartlari\n   bunday ovozlar bilan o'z modelingizni o'qitishga ruxsat berishini oldindan tekshiring.\n";let DSN=0,DSS=0;
function dsl(){const e=$('dsinfo');if(e)e.textContent=`📦 Dataset: ${DSN} ibora, ${(DSS/60).toFixed(1)} daqiqa`+(DSS<3600?' (odatda bir necha soat kerak)':'')}
(async()=>{try{(await dbk()).forEach(k=>{if(k[0]=='d')DSK.add(k)});DSN=DSK.size;const m=await dbg('m|ds');DSS=m?m.sec:0;dsl()}catch(e){}})();
async function dsPut(prof,lg,sp,q){try{if(!$('dsc').checked)return;const t=sp.replace(/\[\[b:\d+\]\]/g,' ').replace(/\s+/g,' ').trim();if(t.length<3||q.length<SR*.6||DSN>=4000)return;const k='d|'+prof+'|'+lg+'|'+t;if(DSK.has(k))return;
 const n=q.length>>1,s=new Int16Array(n);for(let i=0;i<n;i++)s[i]=Math.max(-1,Math.min(1,(q[2*i]+q[2*i+1])/2))*32767;await dbs(k,{s,t});DSK.add(k);DSN++;DSS+=n/24000;dbs('m|ds',{n:DSN,sec:DSS});dsl()}catch(e){}}
async function dsClear(){if(!confirm('Yig‘ilgan dataset o‘chirilsinmi?'))return;const d=await DBP;if(d){const st=d.transaction('c','readwrite').objectStore('c');[...DSK].forEach(k=>st.delete(k));st.delete('m|ds')}DSK.clear();DSN=0;DSS=0;dsl()}
function wav16(s,rate){const b=new ArrayBuffer(44+s.length*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+s.length*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,s.length*2,true);new Int16Array(b,44).set(s);return new Uint8Array(b)}
function zipMake(files){const E=new TextEncoder(),T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0}
 const crc=u=>{let c=~0;for(let i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return ~c>>>0},parts=[],cd=[];let off=0,cs=0;
 for(const[n,u]of files){const nb=E.encode(n),c=crc(u),lh=new DataView(new ArrayBuffer(30)),ch=new DataView(new ArrayBuffer(46));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,0x21,true);lh.setUint32(14,c,true);lh.setUint32(18,u.length,true);lh.setUint32(22,u.length,true);lh.setUint16(26,nb.length,true);
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);ch.setUint32(16,c,true);ch.setUint32(20,u.length,true);ch.setUint32(24,u.length,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
  parts.push(lh,nb,u);cd.push(ch,nb);off+=30+nb.length+u.length;cs+=46+nb.length}
 const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);return new Blob([...parts,...cd,end],{type:'application/zip'})}
async function dsExport(){if(!DSK.size)return log('Avval dataset yig‘ilsin: boshqa AI ovozi bilan video yarating (Dataset yig‘ish yoqilgan bo‘lsin)');
 const E=new TextEncoder(),files=[],meta=['wav|speaker|text'];let i=0;log('Dataset tayyorlanmoqda...');
 for(const k of DSK){const h=await dbg(k);if(!h)continue;const a=k.split('|'),spk=(a[1]+'_'+a[2]).replace(/[^\w]+/g,'_'),nm=`wavs/${String(++i).padStart(5,'0')}.wav`;files.push([nm,wav16(h.s,24000)]);meta.push(`${nm}|${spk}|${String(h.t).replace(/\|/g,' ')}`)}
 files.push(['metadata.csv',E.encode(meta.join('\n')+'\n')],['prepare_dataset.py',E.encode(DSPY)],['README.txt',E.encode(DSRD)]);
 const u=URL.createObjectURL(zipMake(files)),a=document.createElement('a');a.href=u;a.download='quiz_voice_dataset.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);log(`Dataset yuklandi: ${i} ibora`)}
</script></body></html>
