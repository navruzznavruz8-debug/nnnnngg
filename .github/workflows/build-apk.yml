name: Build HTML to APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | sdkmanager --licenses >/dev/null || true

      - name: Create Android WebView project
        run: |
          python3 - << 'PY'
          import os, shutil

          os.makedirs("app/src/main/assets", exist_ok=True)
          os.makedirs("app/src/main/java/com/example/quizapp", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)

          shutil.copyfile("o_v17.html", "app/src/main/assets/o_v17.html")

          files = {
              "settings.gradle": 'rootProject.name = "QuizAppAPK"\ninclude(":app")\n',
              "build.gradle": '''buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath "com.android.tools.build:gradle:8.5.2"
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          ''',
              "gradle.properties": "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n",
              "app/build.gradle": '''plugins {
            id "com.android.application"
          }
          android {
            namespace "com.example.quizapp"
            compileSdk 34
            defaultConfig {
              applicationId "com.example.quizapp"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes {
              release {
                minifyEnabled false
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation "androidx.appcompat:appcompat:1.7.0"
          }
          ''',
              "app/src/main/AndroidManifest.xml": '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:label="QuizApp"
              android:usesCleartextTraffic="true"
              android:theme="@style/Theme.AppCompat.Light.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          ''',
              "app/src/main/res/layout/activity_main.xml": '''<?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/webview"
            android:layout_width="match_parent"
            android:layout_height="match_parent" />
          ''',
              "app/src/main/java/com/example/quizapp/MainActivity.java": '''package com.example.quizapp;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setContentView(R.layout.activity_main);
              WebView webView = findViewById(R.id.webview);
              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("file:///android_asset/o_v17.html");
            }
          }
          '''
          }

          for path, content in files.items():
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          PY

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiz-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
